services:
  - type: web
    name: campo-pecuaria
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    healthCheckPath: /health
    disk:
      name: dados-campo
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PECUARIA_DB
        value: /var/data/pecuaria.sqlite3
      - key: APP_USER
        value: fazenda
      - key: APP_PASSWORD
        sync: false
