services:
  - type: web
    name: campo-pecuaria
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: APP_USER
        value: fazenda
      - key: APP_PASSWORD
        sync: false
